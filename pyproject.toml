[project]
name = "rogue-like-rpg"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (common in game code: l, O, I)
    "B007",  # loop variable not used (common in ECS iteration)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "W", "F841"]  # relaxed rules for test files
"config/__init__.py" = ["F403"]  # intentional star re-exports for backwards compat

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]

[tool.coverage.run]
source = ["core", "game", "config", "bootstrap.py", "game_context.py", "main.py"]
omit = ["tests/*"]

[tool.coverage.report]
# The gate sits just under the current figure: a real regression trips it,
# an ordinary refactor does not. Raise it when coverage climbs, never lower
# it to make a red build green.
fail_under = 88
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
# Scoped on purpose: core/ and the service layer carry the game's rules and are
# the layers worth type-checking first. Widen this list a package at a time.
files = ["core", "game/services"]
# pygame, esper and pathfinding ship no stubs.
ignore_missing_imports = true
# Loose to start: bodies of unannotated functions are not checked. The way to
# tighten is per module below, not by loosening a rule that already passes.
check_untyped_defs = false
warn_unused_ignores = true
